              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Prohibido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Límite de solicitudes excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        persistence:
          type: string
        database:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SuccessEnvelope:
      type: object
      properties:
        datos: {}
        mensaje:
          type: string
        id:
          type: integer
    RegisterRequest:
      type: object
      required: [nombreUsers, emailUsers, contrasenaUsers]
      properties:
        nombreUsers:
          type: string
          minLength: 2
          maxLength: 100
        emailUsers:
          type: string
          format: email
          maxLength: 100
        contrasenaUsers:
          type: string
          format: password
          minLength: 6
          maxLength: 100
        rolUsers:
          type: string
          enum: [USER, STAFF, ADMIN]
          default: USER
        pinemergenciaUsers:
          type: string
          pattern: '^[0-9]{4,12}$'
    LoginRequest:
      type: object
      required: [emailUsers, contrasenaUsers]
      properties:
        emailUsers:
          type: string
          format: email
        contrasenaUsers:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        idUsers:
          type: integer
        nombreUsers:
          type: string
        emailUsers:
          type: string
        rolUsers:
          type: string
    User:
      type: object
      properties:
        idUsers:
          type: integer
        nombreUsers:
          type: string
        emailUsers:
          type: string
        rolUsers:
          type: string
          enum: [USER, STAFF, ADMIN]
        pinemergenciaUsers:
          type: string
        fechaCreacion:
          type: string
          format: date-time
        fotoUrl:
          type: string
          nullable: true
    UserCreate:
      type: object
      required: [nombreUsers, emailUsers, rolUsers, pinemergenciaUsers]
      properties:
        nombreUsers:
          type: string
          minLength: 2
          maxLength: 100
        emailUsers:
          type: string
          format: email
        rolUsers:
          type: string
          enum: [USER, STAFF, ADMIN]
        pinemergenciaUsers:
          type: string
          pattern: '^[0-9]{4,12}$'
    DashboardStats:
      type: object
      properties:
        usuarios:
          type: integer
        alertas:
          type: integer
        alertasPendientes:
          type: integer
        despachos:
          type: integer
    Alerta:
      type: object
      properties:
        id:
          type: integer
        ciudadanoId:
          type: integer
        emergenciaId:
          type: integer
        latitud:
          type: number
        longitud:
          type: number
        estadoAlertas:
          type: string
    AlertTrigger:
      type: object
      required: [emergenciaId, latitud, longitud, ciudadanoId]
      properties:
        emergenciaId:
          type: integer
          minimum: 1
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        ciudadanoId:
          type: integer
          minimum: 1
        esSilenciosa:
          type: integer
          enum: [0, 1]
    AlertTriggerResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        idAlerta:
          type: integer
    AlertDisable:
      type: object
      required: [idAlerta, pin]
      properties:
        idAlerta:
          type: integer
          minimum: 1
        pin:
          type: string
    CatalogoEmergencia:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        prioridad:
          type: string
    CatalogoEmergenciaInput:
      type: object
      required: [nombre, prioridad]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        prioridad:
          type: string
          enum: [BAJA, MEDIA, ALTA]
    CatalogoEntidad:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
    CatalogoEntidadInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
    Despacho:
      type: object
      properties:
        id:
          type: integer
        alertaId:
          type: integer
        estacionId:
          type: integer
        unidad:
          type: string
        fecha:
          type: string
    DespachoInput:
      type: object
      required: [alertaId, estacionId, unidad]
      properties:
        alertaId:
          type: integer
          minimum: 1
        estacionId:
          type: integer
          minimum: 1
        unidad:
          type: string
          minLength: 1
          maxLength: 50
    Especialista:
      type: object
      properties:
        id:
          type: integer
        userid:
          type: integer
        especialidad:
          type: string
        biografia:
          type: string
    EspecialistaInput:
      type: object
      required: [userid, especialidad, biografia]
      properties:
        userid:
          type: integer
          minimum: 1
        especialidad:
          type: string
          minLength: 2
          maxLength: 100
        biografia:
          type: string
          maxLength: 2000
    Estacion:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        entidadId:
          type: integer
        latitud:
          type: number
        longitud:
          type: number
        direccion:
          type: string
        telefono:
          type: string
    EstacionInput:
      type: object
      required: [nombre, entidadId, latitud, longitud, direccion, telefono]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        entidadId:
          type: integer
          minimum: 1
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        direccion:
          type: string
          minLength: 5
          maxLength: 200
        telefono:
          type: string
          minLength: 7
          maxLength: 20
    StaffAutoridad:
      type: object
      properties:
        id:
          type: integer
        estacionId:
          type: integer
        rango:
          type: string
        estatus:
          type: string
        userId:
          type: integer
    StaffAutoridadInput:
      type: object
      required: [estacionId, rango, estatus, userId]
      properties:
        estacionId:
          type: integer
          minimum: 1
        rango:
          type: string
          minLength: 2
          maxLength: 50
        estatus:
          type: string
          enum: [ACTIVO, INACTIVO, LICENCIA, SUSPENDIDO]
        userId:
          type: integer
          minimum: 1
    AgendaCharla:
      type: object
      properties:
        id:
          type: integer
        ciudadanoId:
          type: integer
        especialistaId:
          type: integer
        fecha:
          type: string
          format: date-time
        estado:
          type: string
    AgendaCharlaInput:
      type: object
      required: [ciudadanoId, especialistaId, fecha, estado]
      properties:
        ciudadanoId:
          type: integer
          minimum: 1
        especialistaId:
          type: integer
          minimum: 1
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, CANCELADA]
    VitalData:
      type: object
      properties:
        id:
          type: integer
        idUser:
          type: integer
        grupoSanguineo:
          type: string
        alergias:
          type: string
        enfermedadesCronicas:
          type: string
        contactoEmergencia:
          type: string
    VitalDataInput:
      type: object
      required: [idUser]
      properties:
        idUser:
          type: integer
          minimum: 1
        grupoSanguineo:
          type: string
          enum: [O+, O-, A+, A-, B+, B-, AB+, AB-]
        alergias:
          type: string
          maxLength: 500
        enfermedadesCronicas:
          type: string
          maxLength: 500
        contactoEmergencia:
          type: string
          minLength: 5
          maxLength: 100
    Diario:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        titulo:
          type: string
        contenido:
          type: string
        fechaRegistro:
          type: string
    DiarioInput:
      type: object
      required: [titulo, contenido, userId]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        contenido:
          type: string
          minLength: 1
          maxLength: 5000
        userId:
          type: integer
          minimum: 1
    AiQuery:
      type: object
      required: [userId, prompt]
      properties:
        userId:
          type: integer
          minimum: 1
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
    AiAnswer:
      type: object
      properties:
        respuesta:
          type: string
