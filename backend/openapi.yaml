openapi: 3.0.3
info:
  title: SENTINEL API
  version: 1.0.0
  description: API de coordinación de alertas, bienestar y respuesta ante emergencias.
servers:
  - url: http://localhost:8082
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /Sentinel/Auth/register:
    post:
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/Auth/login:
    post:
      summary: Iniciar sesión y obtener JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /Sentinel/Users:
    get:
      summary: Listar usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /Sentinel/Users/{id}:
    get:
      summary: Obtener usuario por id
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar usuario
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar usuario
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/Dashboard/estadisticas:
    get:
      summary: Estadísticas del panel
      responses:
        '200':
          description: Contadores principales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
  /Sentinel/Alertas:
    get:
      summary: Listar alertas con búsqueda y paginación
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alerta'
    post:
      summary: Crear alerta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertTrigger'
      responses:
        '201':
          description: Alerta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/Alertas/{id}:
    get:
      summary: Obtener alerta por id
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Alerta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerta'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar alerta
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Alerta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar alerta
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Alerta eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/Alertas/disparar:
    post:
      summary: Disparar alerta de emergencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertTrigger'
      responses:
        '201':
          description: Alerta procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTriggerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/Alertas/desactivar:
    post:
      summary: Desactivar alerta con PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDisable'
      responses:
        '200':
          description: Alerta desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/CatalogoEmergencias:
    get:
      summary: Listar catálogo de emergencias
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista del catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoEmergencia'
    post:
      summary: Crear tipo de emergencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoEmergenciaInput'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/CatalogoEmergencias/{id}:
    get:
      summary: Obtener tipo de emergencia
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoEmergencia'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar tipo de emergencia
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoEmergenciaInput'
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar tipo de emergencia
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/CatalogoEntidades:
    get:
      summary: Listar catálogo de entidades
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista del catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoEntidad'
    post:
      summary: Crear entidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoEntidadInput'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/CatalogoEntidades/{id}:
    get:
      summary: Obtener entidad
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoEntidad'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar entidad
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogoEntidadInput'
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar entidad
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/entidades/buscarNombre:
    get:
      summary: Buscar entidad por nombre exacto
      parameters:
        - name: nombre
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entidad encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoEntidad'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/emergencias/prioridad/{prioridad}:
    get:
      summary: Filtrar emergencias por prioridad
      parameters:
        - name: prioridad
          in: path
          required: true
          schema:
            type: string
            enum: [BAJA, MEDIA, ALTA]
      responses:
        '200':
          description: Coincidencias encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogoEmergencia'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/emergencias/total:
    get:
      summary: Total de categorías de emergencia
      responses:
        '200':
          description: Total calculado
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCategorias:
                    type: integer
  /Sentinel/DespachosEmergencia:
    get:
      summary: Listar despachos
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de despachos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Despacho'
    post:
      summary: Despachar unidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DespachoInput'
      responses:
        '201':
          description: Unidad despachada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/DespachosEmergencia/{id}:
    get:
      summary: Obtener despacho
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Despacho'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar despacho
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DespachoInput'
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar despacho
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/Especialistas:
    get:
      summary: Listar especialistas
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de especialistas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Especialista'
    post:
      summary: Crear especialista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialistaInput'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/Especialistas/{id}:
    get:
      summary: Obtener especialista
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especialista'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar especialista
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialistaInput'
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar especialista
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/Estaciones:
    get:
      summary: Listar estaciones
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de estaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estacion'
    post:
      summary: Crear estación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstacionInput'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/Estaciones/{id}:
    get:
      summary: Obtener estación
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estacion'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar estación
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstacionInput'
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar estación
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/estaciones/buscar:
    get:
      summary: Buscar estaciones por nombre
      parameters:
        - name: nombre
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coincidencias encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estacion'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/estaciones/{id}/ubicacion:
    patch:
      summary: Actualizar ubicación de estación
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitud, longitud]
              properties:
                latitud:
                  type: number
                  minimum: -90
                  maximum: 90
                longitud:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        '200':
          description: Ubicación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/estaciones/check:
    get:
      summary: Verificar estado del controlador de estaciones
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
  /Sentinel/estaciones/tipo/{tipoId}:
    get:
      summary: Filtrar estaciones por tipo de entidad
      parameters:
        - name: tipoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista filtrada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estacion'
  /Sentinel/estaciones/contar:
    get:
      summary: Contar estaciones
      responses:
        '200':
          description: Total de estaciones
          content:
            application/json:
              schema:
                type: integer
  /Sentinel/StaffAutoridad:
    get:
      summary: Listar personal de autoridad
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de personal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAutoridad'
    post:
      summary: Crear registro de personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAutoridadInput'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/StaffAutoridad/{id}:
    get:
      summary: Obtener personal por id
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAutoridad'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar personal
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAutoridadInput'
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar personal
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/staff/buscar/cargo:
    get:
      summary: Buscar personal por cargo
      parameters:
        - name: cargo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coincidencias encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAutoridad'
        '404':
          $ref: '#/components/responses/NotFound'
  /Sentinel/staff/check:
    get:
      summary: Verificar estado del servicio de personal
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
  /Sentinel/AgendaCharlas:
    get:
      summary: Listar charlas agendadas
      parameters:
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista de charlas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgendaCharla'
    post:
      summary: Agendar charla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaCharlaInput'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /Sentinel/AgendaCharlas/{id}:
    get:
      summary: Obtener charla
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
